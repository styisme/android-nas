plugins {
    id 'com.android.application'
}

android {
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    namespace 'com.androidnas.tv'
    compileSdk 33

    defaultConfig {
        applicationId "com.androidnas.all.tv"
        minSdk 19
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }

        signingConfigs {
        release {
            def ksPath = System.getenv("NAS_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("NAS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NAS_KEY_ALIAS")
                keyPassword System.getenv("NAS_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            if (System.getenv("NAS_KEYSTORE_PATH") && file(System.getenv("NAS_KEYSTORE_PATH")).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    // 为了保证极低兼容性，不引入任何第三方库，纯原生开发
}
