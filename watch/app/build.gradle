plugins {
    id 'com.android.application'
}

android {
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    namespace 'com.androidnas.watch'
    compileSdk 33
    defaultConfig {
        applicationId "com.androidnas.all.watch"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        release {
            if (System.getenv("NAS_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            def ksPath = System.getenv("NAS_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("NAS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NAS_KEY_ALIAS")
                keyPassword System.getenv("NAS_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        resources.excludes.add("META-INF/*")
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'commons-net:commons-net:3.9.0'
}
