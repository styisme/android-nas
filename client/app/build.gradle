plugins {
    id 'com.android.application'
}

android {
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    namespace 'com.androidnas.client'
    compileSdk 33
    defaultConfig {
        applicationId "com.androidnas.all.client"
        minSdk 21
        targetSdk 33
        versionCode 30000
        versionName "3.1.0"
    }
        signingConfigs {
        release {
            def ksPath = System.getenv("NAS_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("NAS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NAS_KEY_ALIAS")
                keyPassword System.getenv("NAS_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            if (System.getenv("NAS_KEYSTORE_PATH") && file(System.getenv("NAS_KEYSTORE_PATH")).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        // #41: 原 "META-INF/*" 会排掉 okhttp 的 kotlin 元数据，改为精确排除
        resources.excludes.add("META-INF/DEPENDENCIES")
        resources.excludes.add("META-INF/LICENSE*")
        resources.excludes.add("META-INF/NOTICE*")
        resources.excludes.add("META-INF/INDEX.LIST")
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'commons-net:commons-net:3.9.0'
}
