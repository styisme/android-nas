name: Build HarmonyOS HAP (Docker)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'harmony/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:v5.0.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Harmony Environment
        run: |
          cd harmony
          # 确保 hvigor 配置文件存在于正确的位置
          ls -la hvigor/
          
      - name: Build HAP
        run: |
          cd harmony
          # 使用镜像自带的 hvigorw 进行编译
          chmod +x hvigorw || true
          ./hvigorw clean --no-daemon
          ./hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon

      - name: Find and Package HAP
        run: |
          cd harmony
          HAP_FILE=$(find . -name "*.hap" | head -n 1)
          if [ -n "$HAP_FILE" ]; then
            echo "成功编译出产物: $HAP_FILE"
            mkdir -p ../dist
            cp "$HAP_FILE" ../dist/
          else
            echo "未找到 .hap 产物，请检查编译日志。"
            exit 1
          fi

      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmony-hap
          path: dist/*.hap
