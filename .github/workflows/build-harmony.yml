name: Build HarmonyOS HAP (Overseas Optimized)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'harmony/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ohpm and hvigor
        run: |
          npm config set @ohos:registry https://repo.harmonyos.com/npm/
          npm config set registry https://registry.npmmirror.com
          echo "正在从华为源安装 hvigor..."
          npm install -g @ohos/hvigor @ohos/hvigor-ohos-plugin

      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Setup OpenHarmony SDK
        run: |
          echo "正在使用 aria2 多线程下载 OpenHarmony SDK..."
          aria2c -x 16 -s 16 -k 1M --timeout=120 --retry-wait=10 -m 10 \
            -o ohos-sdk.tar.gz \
            https://repo.huaweicloud.com/openharmony/os/4.1-Release/ohos-sdk-windows_linux-public.tar.gz

          echo "下载完成，正在解压..."
          tar -zxvf ohos-sdk.tar.gz

          cd ohos-sdk/linux
          unzip -q ets-linux-x64-4.1.7.5-Release.zip
          unzip -q js-linux-x64-4.1.7.5-Release.zip
          unzip -q native-linux-x64-4.1.7.5-Release.zip
          unzip -q toolchains-linux-x64-4.1.7.5-Release.zip

          echo "DEVECO_SDK_HOME=$GITHUB_WORKSPACE/ohos-sdk/linux" >> $GITHUB_ENV
          echo "OHOS_BASE_SDK_HOME=$GITHUB_WORKSPACE/ohos-sdk/linux" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/ohos-sdk/linux/toolchains:$PATH" >> $GITHUB_ENV

      - name: Build HAP
        run: |
          cd harmony
          # 确保 hvigorw 有执行权限
          chmod +x hvigorw
          
          echo "开始执行 hvigorw 编译..."
          # 按照官方推荐流程：先装依赖，再构建
          ./hvigorw --version --accept-license
          ./hvigorw clean --no-parallel --no-daemon
          ./hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon

      - name: Find and Package HAP
        run: |
          cd harmony
          HAP_FILE=$(find . -name "*.hap" | head -n 1)
          if [ -n "$HAP_FILE" ]; then
            echo "成功编译出产物: $HAP_FILE"
            mkdir -p ../dist
            cp "$HAP_FILE" ../dist/
          else
            echo "未找到 .hap 产物，请检查编译日志。"
            exit 1
          fi

      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmony-hap
          path: dist/*.hap
