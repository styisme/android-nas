name: Build Client APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # --- 新增：自动同步版本号 ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Auto Sync Version
        working-directory: .
        run: python sync_version.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # --- 新增：动态重命名 APK 产物 ---
      - name: Rename APK with Version
        run: |
          VERSION=$(grep -oP '##\s*\[?v?\K\d+\.\d+\.\d+' ../CHANGELOG.md | head -1)
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/android-nas-client-v${VERSION}.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nas-client-android
          path: client/app/build/outputs/apk/debug/*.apk
