name: Build Desktop Client

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: nas-client-linux
          - os: windows-latest
            artifact_name: nas-client-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Auto Sync Version
        run: python sync_version.py

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -oP '##\s*\[?v?\K\d+\.\d+\.\d+' CHANGELOG.md | head -1)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # #44: pip 锁版本，避免 PyInstaller 每夜差异
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'requests>=2.28,<3' 'pyinstaller>=5.13,<6'

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./desktop
        # #87: 去掉 -n 里的 .exe，PyInstaller 会自动追加
        run: pyinstaller -F -w nas_client.py -n nas-client-windows-v${{ env.VERSION }}

      - name: Build with PyInstaller (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./desktop
        run: pyinstaller -F -w nas_client.py -n nas-client-linux-v${{ env.VERSION }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/dist/*
