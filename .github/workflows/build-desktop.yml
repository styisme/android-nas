name: Build Desktop Client

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: nas-client-linux
            asset_name: nas-client-linux-v2.1.0
          - os: windows-latest
            artifact_name: nas-client-windows
            asset_name: nas-client-windows-v2.1.0.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller

      - name: Build with PyInstaller
        working-directory: ./desktop
        run: pyinstaller -F -w nas_client.py -n ${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/dist/${{ matrix.asset_name }}
