name: Build All & Auto Release

on:
  push:
    branches: [ main, master ]
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================= 编译部分 =================
  build-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with: { packages: '' }
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-30" "build-tools;30.0.3" "platform-tools"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Sync Version & Build
        shell: bash
        run: |
          python sync_version.py
          VERSION=$(grep -oP '##\s*\[?v?\K\d+\.\d+\.\d+' CHANGELOG.md | head -1)
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/android-nas-server-v${VERSION}.apk
      - uses: actions/upload-artifact@v4
        with: { name: server-apk, path: app/build/outputs/apk/debug/*.apk }

  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Build
        shell: bash
        run: |
          python sync_version.py
          VERSION=$(grep -oP '##\s*\[?v?\K\d+\.\d+\.\d+' CHANGELOG.md | head -1)
          cd client && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/android-nas-client-v${VERSION}.apk
      - uses: actions/upload-artifact@v4
        with: { name: client-apk, path: client/app/build/outputs/apk/debug/*.apk }

  build-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Build
        shell: bash
        run: |
          python sync_version.py
          VERSION=$(grep -oP '##\s*\[?v?\K\d+\.\d+\.\d+' CHANGELOG.md | head -1)
          cd tv && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/android-nas-tv-v${VERSION}.apk
      - uses: actions/upload-artifact@v4
        with: { name: tv-apk, path: tv/app/build/outputs/apk/debug/*.apk }

  build-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Build
        shell: bash
        run: |
          python sync_version.py
          VERSION=$(grep -oP '##\s*\[?v?\K\d+\.\d+\.\d+' CHANGELOG.md | head -1)
          cd watch && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/android-nas-watch-v${VERSION}.apk
      - uses: actions/upload-artifact@v4
        with: { name: watch-apk, path: watch/app/build/outputs/apk/debug/*.apk }

  build-pc:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: cli, artifact: cli-linux, os_name: linux }
          - { os: windows-latest, target: cli, artifact: cli-windows, os_name: windows }
          - { os: ubuntu-latest, target: gui, artifact: desktop-linux, os_name: linux }
          - { os: windows-latest, target: gui, artifact: desktop-windows, os_name: windows }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install Dependencies
        run: pip install 'requests>=2.28,<3' 'pyinstaller>=5.13,<6'
      - name: Build GUI
        if: matrix.target == 'gui'
        shell: bash
        run: |
          python sync_version.py
          VERSION=$(grep -oP '##\s*\[?v?\K\d+\.\d+\.\d+' CHANGELOG.md | head -1)
          cd desktop && pyinstaller -F -w nas_client.py -n nas-client-${{ matrix.os_name }}-v${VERSION}
      - name: Build CLI
        if: matrix.target == 'cli'
        shell: bash
        run: |
          python sync_version.py
          VERSION=$(grep -oP '##\s*\[?v?\K\d+\.\d+\.\d+' CHANGELOG.md | head -1)
          cd cli && pyinstaller -F nas_cli.py -n nas-cli-${{ matrix.os_name }}-v${VERSION}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.target == 'gui' && 'desktop/dist/*' || 'cli/dist/*' }}

  build-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip Browser Extension
        run: cd browser-extension && zip -r ../browser-extension.zip ./*
      - uses: actions/upload-artifact@v4
        with: { name: browser-extension, path: browser-extension.zip }
      - name: Zip MiniProgram
        run: cd miniprogram && zip -r ../miniprogram.zip ./*
      - uses: actions/upload-artifact@v4
        with: { name: wechat-miniprogram, path: miniprogram.zip }

  # ================= 自动发布部分 =================
  auto-release:
    needs: [build-server, build-client, build-tv, build-watch, build-pc, build-extras]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and Create Tag
        id: check_tag
        run: |
          VERSION=$(grep -oP '##\s*\[?v?\K\d+\.\d+\.\d+' CHANGELOG.md | head -1)
          if [ -z "$VERSION" ]; then
            echo "skip_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION 已存在，跳过发布。"
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "发现新版本 v$VERSION，开始发版流程！"
            echo "skip_release=false" >> $GITHUB_OUTPUT
            echo "version=v$VERSION" >> $GITHUB_OUTPUT
            git config user.name "GitHub Action"
            git config user.email "action@github.com"
            git tag -a "v$VERSION" -m "Auto Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check_tag.outputs.skip_release == 'false'
        with:
          path: ./all_artifacts

      # ======= 核心升级：高容错重命名平铺 =======
      - name: Prepare Standalone Files
        if: steps.check_tag.outputs.skip_release == 'false'
        run: |
          mkdir -p release_files
          VERSION="${{ steps.check_tag.outputs.version }}"
          
          # 使用 find 严格只提取文件 (-type f)，防止误抓目录导致 Release 失败
          # 安卓端
          find ./all_artifacts/server-apk -type f -name "*.apk" -exec cp {} release_files/AndroidNAS-Server-$VERSION.apk \; || true
          find ./all_artifacts/client-apk -type f -name "*.apk" -exec cp {} release_files/AndroidNAS-Client-$VERSION.apk \; || true
          find ./all_artifacts/tv-apk -type f -name "*.apk" -exec cp {} release_files/AndroidNAS-TV-$VERSION.apk \; || true
          find ./all_artifacts/watch-apk -type f -name "*.apk" -exec cp {} release_files/AndroidNAS-Watch-$VERSION.apk \; || true
          
          # PC端 Windows
          find ./all_artifacts/desktop-windows -type f -name "*.exe" -exec cp {} release_files/AndroidNAS-Desktop-Windows-$VERSION.exe \; || true
          find ./all_artifacts/cli-windows -type f -name "*.exe" -exec cp {} release_files/AndroidNAS-CLI-Windows-$VERSION.exe \; || true
          
          # PC端 Linux (不带后缀)
          find ./all_artifacts/desktop-linux -type f -exec cp {} release_files/AndroidNAS-Desktop-Linux-$VERSION \; || true
          find ./all_artifacts/cli-linux -type f -exec cp {} release_files/AndroidNAS-CLI-Linux-$VERSION \; || true
          
          # 额外生态
          find ./all_artifacts/browser-extension -type f -name "*.zip" -exec cp {} release_files/Browser-Extension.zip \; || true
          find ./all_artifacts/wechat-miniprogram -type f -name "*.zip" -exec cp {} release_files/WeChat-MiniProgram.zip \; || true
          
          echo "====== 即将发布的文件列表 ======"
          ls -la release_files/

      - name: Extract Release Notes
        if: steps.check_tag.outputs.skip_release == 'false'
        run: |
          python3 -c "
          import re
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              text = f.read()
          match = re.search(r'## \[.*?\n(.*?)(?=\n## \[|\Z)', text, re.DOTALL)
          if match:
              with open('release_notes.md', 'w', encoding='utf-8') as f:
                  f.write(match.group(1).strip())
          "

      - name: Create GitHub Release
        if: steps.check_tag.outputs.skip_release == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.version }}
          files: release_files/*
          body_path: release_notes.md
          generate_release_notes: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
