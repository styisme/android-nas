<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Android NAS</title>
    <style>
        body { font-family: sans-serif; margin: 16px; }
        #path { color: #666; margin-bottom: 8px; word-break: break-all; }
        .item { padding: 8px 0; border-bottom: 1px solid #eee; }
        .dir { color: #1a73e8; cursor: pointer; }
        .file { color: #333; }
        .size { color: #999; font-size: 12px; margin-left: 12px; }
        .toolbar { margin: 12px 0; }
        input[type=file] { margin-top: 8px; }
    </style>
</head>
<body>
<h3>📁 Android NAS</h3>
<div id="path">/</div>
<div class="toolbar">
    <button onclick="goUp()">⬆ 上级目录</button>
    <button onclick="refresh()">🔄 刷新</button>
</div>
<div id="list"></div>

<h4>上传文件到当前目录</h4>
<form id="uploadForm">
    <input type="file" name="file" id="fileInput">
    <button type="submit">上传</button>
</form>
<p id="msg"></p>

<script>
var currentPath = '/';
function refresh() {
    fetch('/api/list?path=' + encodeURIComponent(currentPath))
        .then(function (r) { return r.json(); })
        .then(function (data) {
            document.getElementById('path').textContent = data.path;
            var list = document.getElementById('list');
            list.innerHTML = '';
            data.files.forEach(function (f) {
                var div = document.createElement('div');
                div.className = 'item';
                var full = (currentPath.endsWith('/') ? currentPath : currentPath + '/') + f.name;
                if (f.dir) {
                    var span = document.createElement('span');
                    span.className = 'dir';
                    span.textContent = '📁 ' + f.name;
                    span.onclick = function () { enterDir(full); };
                    div.appendChild(span);
                } else {
                    div.innerHTML =
                        '<span class="file">📄 ' + escapeHtml(f.name) + '</span>' +
                        '<span class="size">' + formatSize(f.size) + '</span> ' +
                        '<a href="/api/download?path=' + encodeURIComponent(full) + '">下载</a>';
                }
                list.appendChild(div);
            });
        })
        .catch(function () { document.getElementById('msg').textContent = '列表加载失败'; });
}
function enterDir(path) { currentPath = path; refresh(); }
function goUp() {
    if (currentPath === '/' || currentPath === '') return;
    var parts = currentPath.replace(/\/$/, '').split('/');
    parts.pop();
    currentPath = parts.join('/') || '/';
    refresh();
}
function formatSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
}
function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
document.getElementById('uploadForm').onsubmit = function (e) {
    e.preventDefault();
    var input = document.getElementById('fileInput');
    var file = input.files[0];
    if (!file) return;
    var fd = new FormData();
    fd.append('file', file, file.name);
    fd.append('path', currentPath);
    document.getElementById('msg').textContent = '上传中…';
    fetch('/api/upload', { method: 'POST', body: fd })
        .then(function (r) { return r.text(); })
        .then(function (txt) {
            document.getElementById('msg').textContent = txt;
            input.value = '';
            refresh();
        })
        .catch(function () { document.getElementById('msg').textContent = '上传失败'; });
};
refresh();
</script>
</body>
</html>
